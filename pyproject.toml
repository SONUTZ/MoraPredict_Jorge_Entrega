[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morapredict-jorge"
version = "1.0.0"
description = "Motor preventivo explicable para una simulación de deterioro de pago"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "joblib>=1.4,<2"]

[project.optional-dependencies]
demo = ["streamlit>=1.50,<2", "plotly>=5.24,<8"]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["morapredict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
